          cat > app/src/main/java/com/bortoman/enhancecam/Fx.kt <<'EOF'
          package com.bortoman.enhancecam

          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PorterDuff
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.os.Handler
          import android.os.HandlerThread
          import androidx.camera.core.CameraEffect
          import androidx.camera.effects.OverlayEffect

          object Fx {
              @Volatile var mode = 0
              val names = listOf("বন্ধ", "উষ্ণ", "ঠান্ডা", "সিনেমা", "ভিনটেজ")

              private val handler: Handler by lazy {
                  val t = HandlerThread("fx")
                  t.start()
                  Handler(t.looper)
              }
              private val paint = Paint()

              fun effect(forVideo: Boolean): CameraEffect? {
                  return try {
                      val target = if (forVideo) CameraEffect.VIDEO_CAPTURE else CameraEffect.PREVIEW
                      val e = OverlayEffect(target, 0, handler) { }
                      e.setOnDrawListener { frame ->
                          draw(frame.overlayCanvas)
                          true
                      }
                      e
                  } catch (t: Throwable) {
                      null
                  }
              }

              private fun draw(c: Canvas) {
                  c.drawColor(Color.TRANSPARENT, PorterDuff.Mode.CLEAR)
                  val w = c.width.toFloat()
                  val h = c.height.toFloat()
                  when (mode) {
                      1 -> c.drawColor(Color.argb(45, 255, 140, 20))
                      2 -> c.drawColor(Color.argb(45, 20, 120, 255))
                      3 -> {
                          c.drawColor(Color.argb(30, 0, 60, 90))
                          vignette(c, w, h, 170)
                      }
                      4 -> {
                          c.drawColor(Color.argb(70, 160, 110, 50))
                          vignette(c, w, h, 120)
                      }
                  }
              }

              private fun vignette(c: Canvas, w: Float, h: Float, a: Int) {
                  val r = Math.hypot(w.toDouble(), h.toDouble()).toFloat() / 2f
                  paint.shader = RadialGradient(
                      w / 2f, h / 2f, r,
                      intArrayOf(Color.TRANSPARENT, Color.TRANSPARENT, Color.argb(a, 0, 0, 0)),
                      floatArrayOf(0f, 0.55f, 1f), Shader.TileMode.CLAMP
                  )
                  c.drawRect(0f, 0f, w, h, paint)
              }
          }
          EOF
