          cat > app/src/main/java/com/bortoman/enhancecam/VideoBoost.kt <<'EOF'
          package com.bortoman.enhancecam

          import android.content.ContentValues
          import android.content.Context
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import androidx.media3.common.Effect
          import androidx.media3.common.MediaItem
          import androidx.media3.effect.Contrast
          import androidx.media3.effect.HslAdjustment
          import androidx.media3.effect.Presentation
          import androidx.media3.transformer.Composition
          import androidx.media3.transformer.EditedMediaItem
          import androidx.media3.transformer.Effects
          import androidx.media3.transformer.ExportException
          import androidx.media3.transformer.ExportResult
          import androidx.media3.transformer.Transformer
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Locale

          object VideoBoost {
              fun available(): Boolean = true

              fun process(ctx: Context, src: Uri, up4k: Boolean, done: (Uri?) -> Unit) {
                  try {
                      val tmp = File(ctx.cacheDir, "boost_" + System.currentTimeMillis() + ".mp4")
                      val fx = mutableListOf<Effect>()
                      fx.add(HslAdjustment.Builder().adjustSaturation(30f).build())
                      fx.add(Contrast(0.15f))
                      if (up4k) fx.add(Presentation.createForHeight(2160))
                      val item = EditedMediaItem.Builder(MediaItem.fromUri(src))
                          .setEffects(Effects(listOf(), fx))
                          .build()
                      val main = Handler(Looper.getMainLooper())
                      val t = Transformer.Builder(ctx)
                          .addListener(object : Transformer.Listener {
                              override fun onCompleted(composition: Composition, exportResult: ExportResult) {
                                  Thread {
                                      val out = save(ctx, tmp)
                                      main.post { done(out) }
                                  }.start()
                              }

                              override fun onError(
                                  composition: Composition,
                                  exportResult: ExportResult,
                                  exportException: ExportException
                              ) {
                                  tmp.delete()
                                  done(null)
                              }
                          })
                          .build()
                      t.start(item, tmp.absolutePath)
                  } catch (e: Throwable) {
                      done(null)
                  }
              }

              private fun save(ctx: Context, f: File): Uri? {
                  try {
                      val name = "EnhanceCam_color_" +
                          SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                      val cv = ContentValues()
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                      if (Build.VERSION.SDK_INT >= 29) {
                          cv.put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/EnhanceCam")
                      }
                      val cr = ctx.contentResolver
                      val uri = cr.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, cv) ?: return null
                      cr.openOutputStream(uri)?.use { out -> f.inputStream().use { it.copyTo(out) } }
                      f.delete()
                      return uri
                  } catch (e: Throwable) {
                      return null
                  }
              }
          }
          EOF
