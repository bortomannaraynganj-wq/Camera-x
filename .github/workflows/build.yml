name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files
        run: |
          mkdir -p EnhanceCam && cd EnhanceCam
          mkdir -p .
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EnhanceCam"
          include(":app")
          EOF
          mkdir -p .
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          mkdir -p .
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.bortoman.enhancecam"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.bortoman.enhancecam"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-video:1.3.4")
              implementation("androidx.camera:camera-view:1.3.4")
              implementation("androidx.lifecycle:lifecycle-service:2.8.4")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:largeHeap="true"
                  android:label="EnhanceCam"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="fullSensor">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RecorderService"
                      android:exported="false"
                      android:foregroundServiceType="camera|microphone" />
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar" />
          </resources>
          EOF
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.camera.view.PreviewView
                  android:id="@+id/previewView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top"
                  android:background="#80000000"
                  android:orientation="horizontal"
                  android:paddingTop="24dp">

                  <Button
                      android:id="@+id/orientBtn"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:textSize="11sp" />

                  <Button
                      android:id="@+id/viewBtn"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:textSize="11sp" />

                  <Button
                      android:id="@+id/boostBtn"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:textSize="11sp" />

                  <Button
                      android:id="@+id/lastBtn"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:textSize="11sp" />
              </LinearLayout>

              <Chronometer
                  android:id="@+id/timer"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="top|center_horizontal"
                  android:layout_marginTop="120dp"
                  android:background="#80000000"
                  android:padding="8dp"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:visibility="gone" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:background="#80000000"
                  android:orientation="vertical"
                  android:padding="12dp">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">

                      <Button
                          android:id="@+id/torchBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1" />

                      <Button
                          android:id="@+id/qualityBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1" />

                      <Button
                          android:id="@+id/sizeBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1" />

                      <Button
                          android:id="@+id/switchBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">

                      <Button
                          android:id="@+id/photoBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1" />

                      <Button
                          android:id="@+id/filterBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1.3" />

                      <Button
                          android:id="@+id/recordBtn"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1" />
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF
          mkdir -p app/src/main/java/com/bortoman/enhancecam
          cat > app/src/main/java/com/bortoman/enhancecam/MainActivity.kt <<'EOF'
          package com.bortoman.enhancecam

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.ContentValues
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.GestureDetector
          import android.view.MotionEvent
          import android.view.OrientationEventListener
          import android.view.ScaleGestureDetector
          import android.view.Surface
          import android.view.View
          import android.widget.Button
          import android.widget.Chronometer
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.core.UseCaseGroup
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var recordBtn: Button
              private lateinit var switchBtn: Button
              private lateinit var torchBtn: Button
              private lateinit var qualityBtn: Button
              private lateinit var sizeBtn: Button
              private lateinit var photoBtn: Button
              private lateinit var filterBtn: Button
              private lateinit var orientBtn: Button
              private lateinit var viewBtn: Button
              private lateinit var boostBtn: Button
              private lateinit var lastBtn: Button
              private lateinit var timer: Chronometer

              private var cameraProvider: ProcessCameraProvider? = null
              private var camera: Camera? = null
              private var preview: Preview? = null
              private var imageCapture: ImageCapture? = null
              private var lastOri = 0

              companion object {
                  var useBack = true
                  var torchOn = false
                  var qIndex = 2
                  var sizeMode = 0
                  var orientMode = 0
                  var fillView = true
              }
              private val qualityNames = listOf("HD", "Full HD", "2K/সর্বোচ্চ", "4K")
              private val orientNames = listOf("অটো", "সোজা", "আড়াআড়ি")
              private val sizeNames = listOf("অটো", "9:16", "16:9")

              private val oriListener by lazy {
                  object : OrientationEventListener(this) {
                      override fun onOrientationChanged(o: Int) {
                          if (o != ORIENTATION_UNKNOWN) lastOri = o
                      }
                  }
              }

              private val permLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { r ->
                  if (r[Manifest.permission.CAMERA] == true) startCamera()
                  else Toast.makeText(this, "ক্যামেরার অনুমতি দিন", Toast.LENGTH_LONG).show()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  previewView = findViewById(R.id.previewView)
                  recordBtn = findViewById(R.id.recordBtn)
                  switchBtn = findViewById(R.id.switchBtn)
                  torchBtn = findViewById(R.id.torchBtn)
                  qualityBtn = findViewById(R.id.qualityBtn)
                  sizeBtn = findViewById(R.id.sizeBtn)
                  photoBtn = findViewById(R.id.photoBtn)
                  filterBtn = findViewById(R.id.filterBtn)
                  timer = findViewById(R.id.timer)
                  orientBtn = findViewById(R.id.orientBtn)
                  viewBtn = findViewById(R.id.viewBtn)
                  boostBtn = findViewById(R.id.boostBtn)
                  lastBtn = findViewById(R.id.lastBtn)

                  switchBtn.text = "ঘোরান"
                  torchBtn.text = "টর্চ"
                  photoBtn.text = "ছবি"
                  filterBtn.text = "ফিল্টার: " + Fx.names[Fx.mode]
                  qualityBtn.text = qualityNames[qIndex]
                  sizeBtn.text = sizeNames[sizeMode]
                  lastBtn.text = "শেষটা দেখুন"
                  boostBtn.text = if (Cfg.boost) "কালার: অন" else "কালার: অফ"
                  viewBtn.text = if (fillView) "ভিউ: ভরা" else "ভিউ: ছোট"
                  previewView.scaleType =
                      if (fillView) PreviewView.ScaleType.FILL_CENTER else PreviewView.ScaleType.FIT_CENTER
                  applyOrientation()
                  render(RecorderService.recording)

                  setupGestures()

                  recordBtn.setOnClickListener { toggleRecording() }
                  photoBtn.setOnClickListener { takePhoto() }
                  switchBtn.setOnClickListener {
                      useBack = !useBack
                      torchOn = false
                      bindPreview()
                  }
                  torchBtn.setOnClickListener {
                      torchOn = !torchOn
                      camera?.cameraControl?.enableTorch(torchOn)
                  }
                  qualityBtn.setOnClickListener {
                      qIndex = (qIndex + 1) % qualityNames.size
                      qualityBtn.text = qualityNames[qIndex]
                      val c = camera
                      if (qIndex == 3 && c != null &&
                          !QualitySelector.getSupportedQualities(c.cameraInfo).contains(Quality.UHD)
                      ) {
                          Toast.makeText(
                              this,
                              "এই ফোনে আসল 4K রেকর্ড হয় না। Full HD-তে রেকর্ড হবে; কালার অন থাকলে শেষে 4K-তে আপস্কেল হবে (নতুন ডিটেইল বাড়বে না)",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }
                  orientBtn.setOnClickListener {
                      orientMode = (orientMode + 1) % orientNames.size
                      applyOrientation()
                  }
                  viewBtn.setOnClickListener {
                      fillView = !fillView
                      previewView.scaleType =
                          if (fillView) PreviewView.ScaleType.FILL_CENTER else PreviewView.ScaleType.FIT_CENTER
                      viewBtn.text = if (fillView) "ভিউ: ভরা" else "ভিউ: ছোট"
                  }
                  boostBtn.setOnClickListener {
                      Cfg.boost = !Cfg.boost
                      boostBtn.text = if (Cfg.boost) "কালার: অন" else "কালার: অফ"
                      if (Cfg.boost) {
                          Toast.makeText(
                              this,
                              "কালার অন: ছবি/ভিডিও সেভের পরে প্রসেস হবে, একটু সময় লাগবে",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }
                  lastBtn.setOnClickListener {
                      val u = RecorderService.lastUri
                      if (u == null) {
                          Toast.makeText(this, "আগে ছবি বা ভিডিও তুলুন", Toast.LENGTH_SHORT).show()
                      } else {
                          try {
                              startActivity(
                                  Intent(Intent.ACTION_VIEW)
                                      .setDataAndType(u, RecorderService.lastMime)
                                      .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              )
                          } catch (e: ActivityNotFoundException) {
                              Toast.makeText(this, "দেখার অ্যাপ পাওয়া যায়নি", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  sizeBtn.setOnClickListener {
                      sizeMode = (sizeMode + 1) % sizeNames.size
                      sizeBtn.text = sizeNames[sizeMode]
                      val hint = when (sizeMode) {
                          1 -> "9:16: ফোন সোজা ধরে রেকর্ড করুন"
                          2 -> "16:9 (YouTube): ফোন আড়াআড়ি ধরে রেকর্ড করুন"
                          else -> "অটো: ফোন যেভাবে ধরবেন সেভাবেই হবে"
                      }
                      Toast.makeText(this, hint, Toast.LENGTH_SHORT).show()
                  }
                  filterBtn.setOnClickListener {
                      Fx.mode = (Fx.mode + 1) % Fx.names.size
                      filterBtn.text = "ফিল্টার: " + Fx.names[Fx.mode]
                  }

                  val perms = mutableListOf(Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT <= 28) perms.add(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val granted = ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) ==
                      PackageManager.PERMISSION_GRANTED
                  if (granted) startCamera() else permLauncher.launch(perms.toTypedArray())
              }

              override fun onStart() {
                  super.onStart()
                  oriListener.enable()
                  RecorderService.listener = { render(it) }
                  render(RecorderService.recording)
              }

              override fun onStop() {
                  super.onStop()
                  oriListener.disable()
                  RecorderService.listener = null
              }

              private fun applyOrientation() {
                  orientBtn.text = "স্ক্রিন: " + orientNames[orientMode]
                  requestedOrientation = when (orientMode) {
                      1 -> ActivityInfo.SCREEN_ORIENTATION_SENSOR_PORTRAIT
                      2 -> ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      else -> ActivityInfo.SCREEN_ORIENTATION_FULL_SENSOR
                  }
              }

              private fun computeRotation(): Int {
                  val auto = when (lastOri) {
                      in 45..134 -> Surface.ROTATION_270
                      in 135..224 -> Surface.ROTATION_180
                      in 225..314 -> Surface.ROTATION_90
                      else -> Surface.ROTATION_0
                  }
                  return when (sizeMode) {
                      1 -> if (auto == Surface.ROTATION_180) auto else Surface.ROTATION_0
                      2 -> {
                          if (auto == Surface.ROTATION_90 || auto == Surface.ROTATION_270) auto
                          else Surface.ROTATION_90
                      }
                      else -> auto
                  }
              }

              private fun render(on: Boolean) {
                  recordBtn.text = if (on) "■ থামান" else "● রেকর্ড"
                  switchBtn.isEnabled = !on
                  qualityBtn.isEnabled = !on
                  sizeBtn.isEnabled = !on
                  if (on) {
                      timer.visibility = View.VISIBLE
                      timer.base = RecorderService.startedAt
                      timer.start()
                  } else {
                      timer.stop()
                      timer.visibility = View.GONE
                  }
              }

              private fun toggleRecording() {
                  if (RecorderService.recording) {
                      startService(
                          Intent(this, RecorderService::class.java).setAction(RecorderService.ACTION_STOP)
                      )
                  } else {
                      val cam = camera
                      Cfg.up4k = qIndex == 3 && cam != null &&
                          !QualitySelector.getSupportedQualities(cam.cameraInfo).contains(Quality.UHD)
                      val i = Intent(this, RecorderService::class.java)
                          .setAction(RecorderService.ACTION_START)
                          .putExtra("back", useBack)
                          .putExtra("q", qIndex)
                          .putExtra("rot", computeRotation())
                      ContextCompat.startForegroundService(this, i)
                  }
              }

              private fun takePhoto() {
                  val ic = imageCapture ?: return
                  ic.targetRotation = computeRotation()
                  val name = "EnhanceCam_" +
                      SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                  val cv = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT >= 29) {
                          put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/EnhanceCam")
                      }
                  }
                  val opts = ImageCapture.OutputFileOptions.Builder(
                      contentResolver, MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv
                  ).build()
                  ic.takePicture(opts, ContextCompat.getMainExecutor(this),
                      object : ImageCapture.OnImageSavedCallback {
                          override fun onImageSaved(r: ImageCapture.OutputFileResults) {
                              val u = r.savedUri
                              if (u != null) {
                                  RecorderService.lastUri = u
                                  RecorderService.lastMime = "image/jpeg"
                              }
                              if (Cfg.boost && u != null) {
                                  Toast.makeText(
                                      this@MainActivity, "ছবি সেভ হয়েছে, কালার প্রসেস হচ্ছে...", Toast.LENGTH_SHORT
                                  ).show()
                                  Thread {
                                      val o = PhotoBoost.process(applicationContext, u)
                                      runOnUiThread {
                                          if (o != null) {
                                              RecorderService.lastUri = o
                                              Toast.makeText(this@MainActivity, "কালার ছবি তৈরি হয়েছে", Toast.LENGTH_SHORT).show()
                                          } else {
                                              Toast.makeText(this@MainActivity, "কালার প্রসেস হয়নি, আসল ছবি আছে", Toast.LENGTH_SHORT).show()
                                          }
                                      }
                                  }.start()
                              } else {
                                  Toast.makeText(this@MainActivity, "ছবি সেভ হয়েছে", Toast.LENGTH_SHORT).show()
                              }
                          }

                          override fun onError(e: ImageCaptureException) {
                              Toast.makeText(this@MainActivity, "ছবি সেভ হয়নি", Toast.LENGTH_SHORT).show()
                          }
                      })
              }

              private fun startCamera() {
                  val f = ProcessCameraProvider.getInstance(this)
                  f.addListener({
                      cameraProvider = f.get()
                      bindPreview()
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun bindPreview() {
                  val provider = cameraProvider ?: return
                  preview?.let { provider.unbind(it) }
                  imageCapture?.let { provider.unbind(it) }
                  val p = Preview.Builder().build()
                  p.setSurfaceProvider(previewView.surfaceProvider)
                  preview = p
                  val ic = ImageCapture.Builder()
                      .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                      .build()
                  imageCapture = ic
                  val selector = if (useBack) CameraSelector.DEFAULT_BACK_CAMERA
                  else CameraSelector.DEFAULT_FRONT_CAMERA
                  torchOn = false
                  val gb = UseCaseGroup.Builder().addUseCase(p).addUseCase(ic)
                  Fx.effect(false)?.let { gb.addEffect(it) }
                  camera = try {
                      provider.bindToLifecycle(this, selector, gb.build())
                  } catch (e: Exception) {
                      provider.unbind(p, ic)
                      provider.bindToLifecycle(this, selector, p, ic)
                  }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupGestures() {
                  val scale = ScaleGestureDetector(this,
                      object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                          override fun onScale(d: ScaleGestureDetector): Boolean {
                              val c = camera ?: return true
                              val z = c.cameraInfo.zoomState.value?.zoomRatio ?: 1f
                              c.cameraControl.setZoomRatio((z * d.scaleFactor).coerceIn(1f, 3f))
                              return true
                          }
                      })
                  val tap = GestureDetector(this,
                      object : GestureDetector.SimpleOnGestureListener() {
                          override fun onSingleTapUp(e: MotionEvent): Boolean {
                              val p = previewView.meteringPointFactory.createPoint(e.x, e.y)
                              camera?.cameraControl?.startFocusAndMetering(
                                  FocusMeteringAction.Builder(p).build()
                              )
                              return true
                          }
                      })
                  previewView.setOnTouchListener { v, e ->
                      scale.onTouchEvent(e)
                      tap.onTouchEvent(e)
                      if (e.action == MotionEvent.ACTION_UP) v.performClick()
                      true
                  }
              }
          }
          EOF
          mkdir -p app/src/main/java/com/bortoman/enhancecam
          cat > app/src/main/java/com/bortoman/enhancecam/RecorderService.kt <<'EOF'
          package com.bortoman.enhancecam

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.net.Uri
          import android.os.Build
          import android.os.SystemClock
          import android.provider.MediaStore
          import android.widget.Toast
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.UseCaseGroup
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.video.FallbackStrategy
          import androidx.camera.video.MediaStoreOutputOptions
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector
          import androidx.camera.video.Recorder
          import androidx.camera.video.Recording
          import androidx.camera.video.VideoCapture
          import androidx.camera.video.VideoRecordEvent
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.LifecycleService
          import java.text.SimpleDateFormat
          import java.util.Locale

          class RecorderService : LifecycleService() {

              companion object {
                  const val ACTION_START = "com.bortoman.enhancecam.START"
                  const val ACTION_STOP = "com.bortoman.enhancecam.STOP"
                  @Volatile var recording = false
                  @Volatile var startedAt = 0L
                  var listener: ((Boolean) -> Unit)? = null
                  @Volatile var lastUri: Uri? = null
                  @Volatile var lastMime: String = "video/mp4"
              }

              private var rec: Recording? = null
              private var provider: ProcessCameraProvider? = null
              private var vc: VideoCapture<Recorder>? = null
              private var starting = false

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  super.onStartCommand(intent, flags, startId)
                  if (intent?.action == ACTION_STOP) {
                      val r = rec
                      if (r != null) r.stop() else closeService()
                      return START_NOT_STICKY
                  }
                  if (!starting && rec == null) {
                      starting = true
                      enterForeground()
                      begin(
                          intent?.getBooleanExtra("back", true) ?: true,
                          intent?.getIntExtra("q", 2) ?: 2,
                          intent?.getIntExtra("rot", 0) ?: 0
                      )
                  }
                  return START_NOT_STICKY
              }

              private fun enterForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel("rec", "Recording", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val stop = PendingIntent.getService(
                      this, 0,
                      Intent(this, RecorderService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val open = PendingIntent.getActivity(
                      this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = NotificationCompat.Builder(this, "rec")
                      .setSmallIcon(android.R.drawable.presence_video_online)
                      .setContentTitle("EnhanceCam: ভিডিও রেকর্ড হচ্ছে")
                      .setContentIntent(open)
                      .addAction(0, "থামান", stop)
                      .setOngoing(true)
                      .build()
                  val type = if (Build.VERSION.SDK_INT >= 30)
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  else 0
                  ServiceCompat.startForeground(this, 1, n, type)
              }

              private fun begin(back: Boolean, q: Int, rot: Int) {
                  val f = ProcessCameraProvider.getInstance(this)
                  f.addListener({
                      val p = f.get()
                      provider = p
                      val quality = when (q) {
                          0 -> Quality.HD
                          1 -> Quality.FHD
                          3 -> Quality.UHD
                          else -> Quality.HIGHEST
                      }
                      val recorder = Recorder.Builder()
                          .setQualitySelector(
                              QualitySelector.from(quality, FallbackStrategy.lowerQualityOrHigherThan(Quality.SD))
                          ).build()
                      val b = VideoCapture.Builder(recorder)
                      try {
                          b.javaClass.getMethod("setVideoStabilizationEnabled", java.lang.Boolean.TYPE)
                              .invoke(b, true)
                      } catch (e: Exception) {
                      }
                      b.setTargetRotation(rot)
                      val v = b.build()
                      vc = v
                      val sel = if (back) CameraSelector.DEFAULT_BACK_CAMERA
                      else CameraSelector.DEFAULT_FRONT_CAMERA
                      val gb = UseCaseGroup.Builder().addUseCase(v)
                      Fx.effect(true)?.let { gb.addEffect(it) }
                      var bound = false
                      try {
                          p.bindToLifecycle(this, sel, gb.build())
                          bound = true
                      } catch (e: Exception) {
                          p.unbind(v)
                      }
                      if (!bound) {
                          try {
                              p.bindToLifecycle(this, sel, v)
                              bound = true
                          } catch (e: Exception) {
                          }
                      }
                      if (!bound) {
                          Toast.makeText(this, "ক্যামেরা চালু হয়নি", Toast.LENGTH_LONG).show()
                          closeService()
                          return@addListener
                      }
                      startRecording(v)
                  }, ContextCompat.getMainExecutor(this))
              }

              @SuppressLint("MissingPermission")
              private fun startRecording(v: VideoCapture<Recorder>) {
                  val name = "EnhanceCam_" +
                      SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                  val cv = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                      if (Build.VERSION.SDK_INT >= 29) {
                          put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/EnhanceCam")
                      }
                  }
                  val opts = MediaStoreOutputOptions.Builder(
                      contentResolver, MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  ).setContentValues(cv).build()
                  var pending = v.output.prepareRecording(this, opts)
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) ==
                      PackageManager.PERMISSION_GRANTED
                  ) pending = pending.withAudioEnabled()

                  rec = pending.start(ContextCompat.getMainExecutor(this)) { e ->
                      when (e) {
                          is VideoRecordEvent.Start -> {
                              recording = true
                              startedAt = SystemClock.elapsedRealtime()
                              listener?.invoke(true)
                          }
                          is VideoRecordEvent.Finalize -> {
                              recording = false
                              listener?.invoke(false)
                              val ok = !e.hasError()
                              val saved: Uri? = if (ok) e.outputResults.outputUri else null
                              rec = null
                              vc?.let { provider?.unbind(it) }
                              vc = null
                              if (saved != null) {
                                  lastUri = saved
                                  lastMime = "video/mp4"
                              }
                              if (saved != null && Cfg.boost && VideoBoost.available()) {
                                  Toast.makeText(this, "ভিডিও সেভ হয়েছে, কালার প্রসেস হচ্ছে...", Toast.LENGTH_LONG).show()
                                  VideoBoost.process(this, saved, Cfg.up4k) { out ->
                                      if (out != null) lastUri = out
                                      val m = if (out != null) "কালার ভিডিও তৈরি হয়েছে" else "কালার প্রসেস হয়নি, আসল ভিডিও আছে"
                                      Toast.makeText(this, m, Toast.LENGTH_LONG).show()
                                      closeService()
                                  }
                              } else {
                                  val msg = if (ok) "গ্যালারিতে সেভ হয়েছে" else "ভিডিও সেভ হয়নি"
                                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
                                  closeService()
                              }
                          }
                          else -> {}
                      }
                  }
              }

              private fun closeService() {
                  ServiceCompat.stopForeground(this, ServiceCompat.STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }
          }
