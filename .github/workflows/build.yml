          package com.bortoman.enhancecam

          import android.content.ContentValues
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.media.ExifInterface
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import java.text.SimpleDateFormat
          import java.util.Locale

          object Cfg {
              @Volatile var boost = false
              @Volatile var up4k = false
          }

          object PhotoBoost {
              fun process(ctx: Context, src: Uri): Uri? {
                  try {
                      val cr = ctx.contentResolver
                      var deg = 0
                      cr.openInputStream(src)?.use { s ->
                          val o = ExifInterface(s).getAttributeInt(
                              ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL
                          )
                          deg = when (o) {
                              ExifInterface.ORIENTATION_ROTATE_90 -> 90
                              ExifInterface.ORIENTATION_ROTATE_180 -> 180
                              ExifInterface.ORIENTATION_ROTATE_270 -> 270
                              else -> 0
                          }
                      }
                      val bounds = BitmapFactory.Options()
                      bounds.inJustDecodeBounds = true
                      cr.openInputStream(src)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                      var sample = 1
                      while (maxOf(bounds.outWidth, bounds.outHeight) / sample > 3200) sample *= 2
                      val opts = BitmapFactory.Options()
                      opts.inSampleSize = sample
                      val bmp = cr.openInputStream(src)?.use { BitmapFactory.decodeStream(it, null, opts) }
                          ?: return null

                      val cm = ColorMatrix()
                      cm.setSaturation(1.3f)
                      val c = 1.12f
                      val t = (-0.5f * c + 0.5f) * 255f
                      cm.postConcat(
                          ColorMatrix(
                              floatArrayOf(
                                  c, 0f, 0f, 0f, t,
                                  0f, c, 0f, 0f, t,
                                  0f, 0f, c, 0f, t,
                                  0f, 0f, 0f, 1f, 0f
                              )
                          )
                      )
                      val paint = Paint()
                      paint.colorFilter = ColorMatrixColorFilter(cm)
                      val out = Bitmap.createBitmap(bmp.width, bmp.height, Bitmap.Config.ARGB_8888)
                      Canvas(out).drawBitmap(bmp, 0f, 0f, paint)
                      bmp.recycle()
                      var fin = out
                      if (deg != 0) {
                          val m = Matrix()
                          m.postRotate(deg.toFloat())
                          fin = Bitmap.createBitmap(out, 0, 0, out.width, out.height, m, true)
                          out.recycle()
                      }
                      val name = "EnhanceCam_color_" +
                          SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(System.currentTimeMillis())
                      val cv = ContentValues()
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, "image/jpeg")
                      if (Build.VERSION.SDK_INT >= 29) {
                          cv.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/EnhanceCam")
                      }
                      val uri = cr.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv) ?: return null
                      cr.openOutputStream(uri)?.use { fin.compress(Bitmap.CompressFormat.JPEG, 95, it) }
                      fin.recycle()
                      return uri
                  } catch (e: Throwable) {
                      return null
                  }
              }
          }
